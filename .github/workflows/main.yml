'@
          
          $ovpnConfig | Out-File -FilePath "$configDir\config.ovpn" -Encoding ascii

      - name: Start OpenVPN Service
        run: |
          # Install OpenVPN as a service
          & "C:\Program Files\OpenVPN\bin\openvpn.exe" --install --service-name "OpenVPN" --config "C:\Program Files\OpenVPN\config\config.ovpn"
          
          # Start the service
          Start-Service -Name "OpenVPN" -ErrorAction SilentlyContinue
          
          # Wait for connection
          Start-Sleep -Seconds 30
          
          # Verify VPN connection (check if tun interface got IP)
          $vpnIP = ipconfig | Select-String "Tunnel" -Context 2,5
          Write-Host "VPN Interface Status:"
          Write-Host $vpnIP

      - name: Get Public IP via VPN
        run: |
          $publicIP = Invoke-RestMethod -Uri "https://api.ipify.org"
          Write-Host "Public IP (via VPN): $publicIP"
          echo "VPN_PUBLIC_IP=$publicIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "VPN Public IP: $env:VPN_PUBLIC_IP"
          Write-Host "RDP is running on localhost:3389"
          Write-Host "To connect: Use the VPN IP above or use Tailscale/port forwarding"

      - name: Maintain Connection with Auto-Renewal Every 6 Hours
        run: |
          Write-Host "`n=== RDP + VPN ACCESS ==="
          Write-Host "VPN Public IP: $env:VPN_PUBLIC_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "=================================`n"

          $renewInterval = 21600  # 6 hours
          $startTime = Get-Date
          $endTime = $startTime.AddDays(365)

          while ((Get-Date) -lt $endTime) {
              Write-Host "[$(Get-Date)] RDP+VPN Active - Next renewal in 6 hours"
              Start-Sleep -Seconds $renewInterval
              
              # Restart OpenVPN to renew connection
              Restart-Service -Name "OpenVPN" -ErrorAction SilentlyContinue
              Write-Host "[$(Get-Date)] VPN Renewed successfully - No downtime"
              
              # Update public IP
              $newIP = Invoke-RestMethod -Uri "https://api.ipify.org" -ErrorAction SilentlyContinue
              if ($newIP) {
                  Write-Host "[$(Get-Date)] New Public IP: $newIP"
              }
          }
