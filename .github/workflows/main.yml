name: RDP-VPN

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 525600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-OpenVPN" 2>$null
          netsh advfirewall firewall add rule name="RDP-OpenVPN" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install OpenVPN
        run: |
          $ovpnUrl = "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.10-I001-amd64.msi"
          $installerPath = "$env:TEMP\openvpn.msi"
          Invoke-WebRequest -Uri $ovpnUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Configure OpenVPN
        run: |
          $configDir = "C:\Program Files\OpenVPN\config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          
          # Base64 encoded OpenVPN config (to avoid YAML heredoc issues)
          $ovpnBase64 = ""
          
          # Decode and save config
          [System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($ovpnBase64)) | 
            Out-File -FilePath "$configDir\config.ovpn" -Encoding ascii

      - name: Start OpenVPN Service
        run: |
          Stop-Service -Name "OpenVPN" -Force -ErrorAction SilentlyContinue
          
          & "C:\Program Files\OpenVPN\bin\openvpn.exe" --install --service-name "OpenVPN" --config "C:\Program Files\OpenVPN\config\config.ovpn"
          
          Start-Service -Name "OpenVPN" -ErrorAction SilentlyContinue
          
          Start-Sleep -Seconds 45
          
          $vpnIP = ipconfig | Select-String "Tunnel" -Context 2,5
          Write-Host "VPN Interface Status:"
          Write-Host $vpnIP

      - name: Get Public IP via VPN
        run: |
          try {
              $publicIP = Invoke-RestMethod -Uri "https://api.ipify.org" -ErrorAction Stop
              Write-Host "Public IP (via VPN): $publicIP"
              echo "VPN_PUBLIC_IP=$publicIP" >> $env:GITHUB_ENV
          } catch {
              Write-Host "Could not get public IP, using localhost"
              echo "VPN_PUBLIC_IP=localhost" >> $env:GITHUB_ENV
          }

      - name: Display RDP Access Info
        run: |
          Write-Host "`n========================================="
          Write-Host "     RDP + VPN ACCESS INFORMATION"
          Write-Host "========================================="
          Write-Host "VPN Public IP: $env:VPN_PUBLIC_IP"
          Write-Host "Username: RDP"
          $pwd = (echo $env:RDP_CREDS) -replace 'RDP_CREDS=User: RDP \| Password: ', ''
          Write-Host "Password: $pwd"
          Write-Host "========================================="
          Write-Host "Note: RDP runs on localhost:3389"
          Write-Host "To connect externally, use Tailscale or port forwarding"
          Write-Host "=========================================`n"

      - name: Keep Connection Alive (6-Hour Renewal)
        run: |
          $renewInterval = 21600
          $endTime = (Get-Date).AddDays(365)
          
          while ((Get-Date) -lt $endTime) {
              Write-Host "[$(Get-Date)] RDP+VPN Active - Next renewal in 6 hours"
              Start-Sleep -Seconds $renewInterval
              
              Restart-Service -Name "OpenVPN" -ErrorAction SilentlyContinue
              Write-Host "[$(Get-Date)] VPN Renewed - No downtime"
              
              try {
                  $newIP = Invoke-RestMethod -Uri "https://api.ipify.org" -ErrorAction Stop
                  Write-Host "[$(Get-Date)] New Public IP: $newIP"
              } catch {
                  Write-Host "[$(Get-Date)] Could not update IP"
              }
          }
